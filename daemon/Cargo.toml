[package]
name = "omarchy-focus"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Focus engine for Omarchy: Pomodoro timer, research-based focus sounds and alerts"
publish = false

[lib]
name = "focus"
path = "src/lib.rs"

[[bin]]
name = "omarchy-focus"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libpulse-binding = "2"
libpulse-simple-binding = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.5: its decoder API is the one this code is written against.
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "mp3", "flac", "wav", "pcm"] }
toml = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
